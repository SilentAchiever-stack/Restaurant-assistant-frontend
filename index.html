<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Restaurant Assistant</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Karla:wght@400;500;700&display=swap');
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Karla', sans-serif;
    background: #08100f;
    color: #e6f2f0;
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0;
  }

  .chat-container {
    width: 100%;
    max-width: 440px;
    height: 100vh;
    height: 100dvh;
    background: #0d1f1d;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  .chat-header {
    background: #0a2e2b;
    color: #7fd9cc;
    padding: 18px 20px;
    font-family: 'Fraunces', serif;
    font-size: 1.15rem;
    font-weight: 600;
    border-bottom: 1px solid #163d39;
    flex-shrink: 0;
  }

  .messages {
    flex: 1;
    overflow-y: auto;
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 12px;
    background: #0d1f1d;
  }

  .msg {
    max-width: 82%;
    padding: 11px 15px;
    border-radius: 14px;
    line-height: 1.45;
    font-size: 0.92rem;
    white-space: pre-wrap;
  }

  .msg.bot {
    background: #133934;
    color: #d9f2ee;
    align-self: flex-start;
    border-bottom-left-radius: 4px;
  }

  .msg.user {
    background: #1a5c53;
    color: #f4fffc;
    align-self: flex-end;
    border-bottom-right-radius: 4px;
  }

  .msg.typing {
    background: #133934;
    color: #6ba69c;
    align-self: flex-start;
    font-style: italic;
  }

  .input-row {
    display: flex;
    padding: 14px;
    gap: 10px;
    background: #0a2e2b;
    border-top: 1px solid #163d39;
    flex-shrink: 0;
  }

  .input-row input {
    flex: 1;
    padding: 11px 14px;
    border-radius: 24px;
    border: 1px solid #1e4a44;
    font-family: 'Karla', sans-serif;
    font-size: 0.92rem;
    outline: none;
    background: #0d1f1d;
    color: #e6f2f0;
  }

  .input-row input::placeholder {
    color: #5a8a82;
  }

  .input-row input:focus {
    border-color: #2fbfa8;
  }

  .input-row button {
    background: #2fbfa8;
    color: #06110f;
    border: none;
    border-radius: 24px;
    padding: 0 20px;
    font-weight: 700;
    cursor: pointer;
    transition: background 0.15s;
  }

  .input-row button:hover {
    background: #45d6bf;
  }

  .input-row button:disabled {
    background: #1e4a44;
    color: #5a8a82;
    cursor: not-allowed;
  }

  .suggestions {
    padding: 0 20px 14px;
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    background: #0d1f1d;
    flex-shrink: 0;
  }

  .suggestion-chip {
    background: #133934;
    border: 1px solid #1e4a44;
    border-radius: 16px;
    padding: 6px 12px;
    font-size: 0.78rem;
    cursor: pointer;
    color: #9fd9cf;
    transition: background 0.15s;
  }

  .suggestion-chip:hover {
    background: #1a4a44;
  }

  /* Responsive breakpoints */

  /* Small phones - tighten padding and font size slightly */
  @media (max-width: 380px) {
    .chat-header {
      padding: 14px 16px;
      font-size: 1.05rem;
    }
    .messages {
      padding: 14px;
    }
    .msg {
      max-width: 88%;
      font-size: 0.88rem;
    }
    .input-row {
      padding: 10px;
    }
    .suggestions {
      padding: 0 14px 10px;
    }
  }

  /* Tablets and up - float as a centered card instead of full-screen */
  @media (min-width: 640px) {
    body {
      padding: 24px;
    }
    .chat-container {
      height: min(640px, 90vh);
      border-radius: 18px;
      box-shadow: 0 24px 70px rgba(0,0,0,0.5);
    }
  }

  /* Large desktop - slightly roomier card */
  @media (min-width: 1024px) {
    .chat-container {
      max-width: 460px;
    }
  }
</style>
</head>
<body>

<div class="chat-container">
  <div class="chat-header">Restaurant Assistant</div>

  <div class="messages" id="messages">
    <div class="msg bot">Hi! I can tell you about our restaurants, or book you a table. Try asking about cuisine or hours, or say "book a table."</div>
  </div>

  <div class="suggestions">
    <div class="suggestion-chip" onclick="sendSuggestion('What restaurants do you have?')">What restaurants?</div>
    <div class="suggestion-chip" onclick="sendSuggestion('Book a table for 2 at Yellow Chilli tonight at 7pm, name John')">Book a table</div>
    <div class="suggestion-chip" onclick="sendSuggestion('Check my reservation, name John')">Check my booking</div>
  </div>

  <div class="input-row">
    <input type="text" id="userInput" placeholder="Ask or book..." onkeydown="if(event.key==='Enter') sendMessage()">
    <button id="sendBtn" onclick="sendMessage()">Send</button>
  </div>
</div>

<script>
  const API_URL = 'https://restaurant-assistant-backend-e4ws.onrender.com/api/chat';
  const messagesEl = document.getElementById('messages');
  const inputEl = document.getElementById('userInput');
  const sendBtn = document.getElementById('sendBtn');

  function addMessage(text, sender) {
    const div = document.createElement('div');
    div.className = `msg ${sender}`;
    div.textContent = text;
    messagesEl.appendChild(div);
    messagesEl.scrollTop = messagesEl.scrollHeight;
    return div;
  }

  function sendSuggestion(text) {
    inputEl.value = text;
    sendMessage();
  }

  async function sendMessage() {
    const text = inputEl.value.trim();
    if (!text) return;
    addMessage(text, 'user');
    inputEl.value = '';
    sendBtn.disabled = true;
    const typingEl = addMessage('Thinking...', 'typing');

    try {
      const res = await fetch(API_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ message: text })
      });
      const data = await res.json();
      typingEl.remove();
      addMessage(data.answer || "Something went wrong.", 'bot');
    } catch (err) {
      typingEl.remove();
      addMessage("Couldn't reach the server. Make sure server.js is running.", 'bot');
    }

    sendBtn.disabled = false;
    inputEl.focus();
  }
</script>

</body>
</html>
